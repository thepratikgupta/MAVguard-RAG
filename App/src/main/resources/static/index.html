<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3GPP RAG Assistant</title>
    <style>
        :root {
            --bg-dark: #121212;
            --surface-dark: #1E1E1E;
            --primary-accent: #BB86FC;
            --text-light: #E0E0E0;
            --text-dim: #A0A0A0;
            --border-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            display: flex;
            height: 100vh;
        }

        .chat-container {
            width: 60%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
        }

        .header {
            padding: 20px;
            background-color: var(--surface-dark);
            border-bottom: 1px solid var(--border-color);
            font-size: 1.2rem;
            font-weight: bold;
        }

        .chat-history {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 15px;
            border-radius: 8px;
            line-height: 1.5;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--primary-accent);
            color: #000;
        }

        .message.bot {
            align-self: flex-start;
            background-color: var(--surface-dark);
            border: 1px solid var(--border-color);
            white-space: pre-wrap; /* Keeps the line breaks from the LLM */
        }

        .input-area {
            padding: 20px;
            background-color: var(--surface-dark);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-size: 1rem;
        }

        button {
            padding: 12px 24px;
            border-radius: 6px;
            border: none;
            background-color: var(--primary-accent);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background-color: var(--text-dim);
            cursor: not-allowed;
        }

        .sidebar {
            width: 40%;
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            background-color: var(--surface-dark);
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
        }

        .sources-container {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .source-card {
            background-color: var(--surface-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }

        .source-header {
            font-weight: bold;
            color: var(--primary-accent);
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .source-score {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .source-content {
            font-size: 0.85rem;
            color: #CCC;
            line-height: 1.4;
        }

        .loading {
            align-self: flex-start;
            color: var(--text-dim);
            font-style: italic;
            display: none;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">Mavenir 3GPP Zero-Hallucination Assistant</div>
    <div class="chat-history" id="chatHistory">
        <div class="message bot">Hello! I am a strict 3GPP Telecom Assistant. Ask me a question about the 5G Core Architecture.</div>
        <div class="loading" id="loadingIndicator">Searching 3GPP standards and generating response...</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="e.g., What is the role of the AMF?" onkeypress="handleKeyPress(event)">
        <button id="sendBtn" onclick="sendMessage()">Ask</button>
    </div>
</div>

<div class="sidebar">
    <div class="sidebar-header">Source Inspector (Lucene Retrieval)</div>
    <div class="sources-container" id="sourcesContainer">
        <div style="color: var(--text-dim); font-style: italic; padding: 10px;">Sources used to answer your question will appear here.</div>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const query = inputField.value.trim();
        if (!query) return;

        // 1. Display User Message
        addMessageToChat(query, 'user');
        inputField.value = '';

        // 2. UI Loading State
        document.getElementById('sendBtn').disabled = true;
        document.getElementById('loadingIndicator').style.display = 'block';
        document.getElementById('sourcesContainer').innerHTML = ''; // Clear old sources

        try {
            // 3. Call your Spring Boot REST API
            const response = await fetch('/api/v1/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: query })
            });

            if (!response.ok) throw new Error('API request failed');
            const data = await response.json();

            // 4. Display Bot Answer
            addMessageToChat(data.answer, 'bot');

            // 5. Populate the Source Inspector Sidebar
            if (data.wasFoundInDocs && data.sourcesUsed.length > 0) {
                data.sourcesUsed.forEach(source => {
                    addSourceCard(source);
                });
            } else {
                document.getElementById('sourcesContainer').innerHTML =
                    '<div style="color: #ff5252; padding: 10px;">No relevant sources found. Guardrail activated.</div>';
            }

        } catch (error) {
            addMessageToChat("Error connecting to the backend. Is Spring Boot running?", 'bot');
        } finally {
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('loadingIndicator').style.display = 'none';
        }
    }

    function addMessageToChat(text, sender) {
        const history = document.getElementById('chatHistory');
        const loading = document.getElementById('loadingIndicator');

        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        msgDiv.textContent = text;

        // Insert the message right before the loading indicator
        history.insertBefore(msgDiv, loading);
        history.scrollTop = history.scrollHeight;
    }

    function addSourceCard(source) {
        const container = document.getElementById('sourcesContainer');

        const card = document.createElement('div');
        card.className = 'source-card';

        card.innerHTML = `
                <div class="source-header">${source.docId} | Clause: ${source.sectionNumber}</div>
                <div class="source-score">Lucene Relevance Score: ${source.score.toFixed(3)}</div>
                <div class="source-content">${source.content}</div>
            `;

        container.appendChild(card);
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
</script>
</body>
</html>
